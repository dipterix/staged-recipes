{% set version = "0.5.0" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-shinychat
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/shinychat_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/shinychat/shinychat_{{ version }}.tar.gz
  sha256: 25f1249fb18457fe4a51a55c9507cafba49abfb5536fdf213fd8ba7bc11a4e47

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-base64enc
    - r-bslib >=0.12.0
    - r-cli
    - r-coro
    - r-ellmer >=0.4.1
    - r-fastmap
    - r-htmltools
    - r-jsonlite
    - r-lifecycle
    - r-promises >=1.3.2
    - r-r6 >=2.5.0
    - r-rlang >=1.2.0
    - r-s7
    - r-shiny >=1.10.0
  run:
    - r-base
    - r-base64enc
    - r-bslib >=0.12.0
    - r-cli
    - r-coro
    - r-ellmer >=0.4.1
    - r-fastmap
    - r-htmltools
    - r-jsonlite
    - r-lifecycle
    - r-promises >=1.3.2
    - r-r6 >=2.5.0
    - r-rlang >=1.2.0
    - r-s7
    - r-shiny >=1.10.0

test:
  commands:
    - $R -e "library('shinychat')"           # [not win]
    - "\"%R%\" -e \"library('shinychat')\""  # [win]

about:
  home: https://posit-dev.github.io/shinychat/r/
  dev_url: https://github.com/posit-dev/shinychat
  license: MIT
  summary: Chat UI Component for 'shiny'
  description: |
    Provides a scrolling chat interface with multiline input, suitable for
    creating chatbot apps based on Large Language Models (LLMs). Designed
    to work particularly well with the 'ellmer' R package for calling LLMs.
  license_family: MIT
  license_file:
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/MIT'
    - LICENSE

extra:
  recipe-maintainers:
    - dipterix
    - conda-forge/r
